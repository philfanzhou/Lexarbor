name: CI

on:
  # There is deliberately no push trigger. A push to the default branch already
  # runs this workflow through release.yml's verify job, which publishing edge
  # depends on, so triggering here as well would build every image a second
  # time for the same commit without checking anything new.
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The ci- prefix keeps this distinct from callers such as release.yml: in a
  # reusable workflow github.workflow is the caller's name, so without the
  # prefix a called run would land in the caller's own group and cancel it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Lexarbor.sln

      - name: Audit direct and transitive packages
        shell: pwsh
        run: ./.github/scripts/assert-no-vulnerable-dotnet-packages.ps1

      - name: Build
        run: dotnet build Lexarbor.sln --configuration Release --no-restore

      # Whitespace, using order and analyzer fixes, all of them decided by
      # .editorconfig rather than by this step. It runs after the build so a
      # compile error is reported as one instead of as a formatting failure.
      # `dotnet format` on its own rewrites the tree; --verify-no-changes only
      # reports, so a violation fails the job rather than being silently fixed.
      - name: Verify formatting
        run: dotnet format Lexarbor.sln --verify-no-changes --no-restore

      # Arguments after `--` go to Microsoft.Testing.Platform, which replaces the
      # VSTest --logger/--collect options. Report file names are left at their
      # defaults so the two test projects do not overwrite each other's output.
      - name: Test with coverage
        run: >-
          dotnet test Lexarbor.sln
          --configuration Release
          --no-build
          --results-directory TestResults
          --
          --report-xunit-trx
          --coverage
          --coverage-output-format cobertura

      - name: Write test summary
        if: always()
        shell: pwsh
        run: ./.github/scripts/write-test-summary.ps1 -ResultsDirectory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run test:types

      # Deliberately without --with-deps. The runner image already carries every
      # shared library Chromium links against, which apt confirms on each run by
      # reporting all 26 of them as already current; the only packages the flag
      # actually installs are nine CJK, Thai, and Cyrillic font packages that
      # exist so screenshots of arbitrary pages render. This suite has no visual
      # assertions and no non-Latin text, so those 21 MB buy nothing and cost the
      # step its only unreliable dependency: the Ubuntu archive, which has served
      # that same fixed payload at anywhere from 19.6 MB/s to 63 kB/s and twice
      # stalled outright until the job timeout killed it. The browser itself
      # comes from Playwright's own CDN and has never been the slow part.
      #
      # A missing library would now surface as a fast, loud failure when the
      # browser launches, which is a better failure than a fifteen-minute stall.
      - name: Install Chromium
        # Short enough to fail well inside the job budget, so a stalled download
        # leaves time for nothing else to be blamed for it.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-test-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container integration and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deliberately a value no release and no default can produce, so the
      # startup check proves the version travelled from the build argument
      # through to the running application instead of matching by coincidence.
      APP_VERSION: 0.0.0-ci.${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --build-arg APP_VERSION="$APP_VERSION" -t lexarbor:ci .

      - name: Test startup and persistent files
        run: bash .github/scripts/test-container.sh lexarbor:ci "$APP_VERSION"

      - name: Scan image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lexarbor:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      # The release workflow publishes linux/amd64 and linux/arm64, and a tag is
      # the first moment ARM64 would otherwise be built at all. The Dockerfile
      # pins both build stages to the build platform, so the ARM64 leg is only
      # the runtime stage and this check stays cheap. It runs last because the
      # steps above give the faster signal, and it cannot load a multi-platform
      # result into the daemon, so nothing is exported.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build multi-platform image
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file Dockerfile
          --build-arg APP_VERSION=$APP_VERSION
          --output type=cacheonly
          .
