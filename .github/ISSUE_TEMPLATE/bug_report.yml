name: 缺陷报告
description: 报告可复现的 Lexarbor 缺陷
title: "缺陷："
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交密钥、个人数据或安全漏洞；安全问题请按 SECURITY.md 的私密流程报告。
  - type: textarea
    id: description
    attributes:
      label: 背景与目标
      description: 发生了什么、预期是什么、影响了哪些用户或部署？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小且稳定的复现步骤、失败输出和受影响的 API/页面。
      placeholder: |
        1. 使用 ... 启动 Lexarbor
        2. 打开 ...
        3. 观察到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布 tag、镜像 tag 或 commit SHA。
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker
        - 本地 .NET 和 Vite
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请移除凭据、token、个人数据和无关输出。
      render: shell
  - type: textarea
    id: scope
    attributes:
      label: 最小修改范围与验收标准
      description: 说明建议修改什么、明确排除什么，以及如何逐条验证。
    validations:
      required: true
  - type: textarea
    id: adjacent
    attributes:
      label: 已知邻近问题
      description: 完整阅读相关实现后发现的既有问题请单独开 issue 并链接；确认没有时写“无”。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 issue，确认不是重复报告。
          required: true
        - label: 本报告不包含安全漏洞细节、secret 或敏感数据。
          required: true
