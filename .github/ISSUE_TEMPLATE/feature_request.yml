name: Feature request
description: Propose an improvement to Lexarbor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and important constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or alternative designs you considered.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Consider public APIs, configuration, SQLite data, authentication, and Docker deployment.
