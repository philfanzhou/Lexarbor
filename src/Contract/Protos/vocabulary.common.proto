syntax = "proto3";

package ruoyu.study.vocabulary.v1;

option csharp_namespace = "Ruoyu.Study.Vocabulary.Contract.Protos";

// === 请求信息 ===
message IdRequest {
  string id = 1;
}

message StringRequest {
  string value = 1; // 通用的字符串参数
}

// === 响应信息 ===
message BoolResponse {
  bool success = 1;
  optional string error_message = 2;
}

// 字符串列表（去重）
message StringList {
  repeated string items = 1;
}

message VocabularyMeaningDto {
  string id        = 1; // 为空表示新增
  string vocabulary_id = 2;
  string book_id = 3;
  string part_of_speech = 4;
  string meaning   = 5;
  string example   = 6;
}

// 词汇数据传输模型
message VocabularyDto {
  string id = 1; // 为空表示新增
  string word = 2;
  string phonetic = 3;
  repeated VocabularyMeaningDto meanings = 4;
}

// 书籍DTO
message VocabularyBookDto {
  string id               = 1;  // 主键
  string book_name        = 2;  // 书籍名称（必填）
  string description      = 3;  // 描述
  string category         = 4;  // 分类标签
  string education_level  = 5;  // 教育阶段
  string grade            = 6;  // 年级
  string publisher        = 7;  // 出版社/版本
  int32  display_order    = 8;  // 展示顺序
  bool   status           = 9;  // 状态：true=正常，false=下线
  string icon_url         = 10; // 封面图URL
}

message VocabularyDtoList {
	repeated VocabularyDto words = 1;
}

// 书籍列表响应
message VocabularyBookDtoList {
  repeated VocabularyBookDto books = 1;  // 书籍列表
}