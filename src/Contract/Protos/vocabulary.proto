syntax = "proto3";

package ruoyu.study.vocabulary.v1;

import "Protos/vocabulary.common.proto";

option csharp_namespace = "Ruoyu.Study.Vocabulary.Contract.Protos";

service VocabularyGrpcService {  
  // 获取单个词汇
  rpc Get(GetDetailRequest) returns (VocabularyDto);
  
  // 搜索词汇
  rpc Search(SearchRequest) returns (VocabularyPageResult);

  rpc AddOrUpdate(AddOrUpdateRequest) returns (BoolResponse);

  rpc GetQuestion(GetQuestionRequest) returns (QuestionResponse);
}

message GetDetailRequest {
  string word_id = 1;  // 词汇ID
  string book_id = 2;  // 词汇本ID
}

message AddOrUpdateRequest {
  VocabularyDto word     = 1;
  VocabularyMeaningDto meaning = 2;
}

message SearchRequest {
  string keyword = 1;   // 搜索关键词 (可选)
  int32 page = 2;       // 页码 (默认1)
  int32 size = 3;       // 每页数量 (默认20)
}

// 分页响应结构
message VocabularyPageResult {
  repeated VocabularyDto items = 1;  // 当前页的词汇列表
  int32 total_page = 2;             // 总页数
  int32 total_count = 3;             // 总记录数
}

message GetQuestionRequest {
  string word_id = 1;
  string book_id = 2;
  optional bool chinese_to_english = 3;  // 可选参数：false=英语选中文, true=中文选英语。不传则智能决定
}

message QuestionResponse {
  string word = 1;                       // 要测试的单词
  repeated OptionDto options = 2;        // 四个选项
}

message OptionDto {
  string meaning = 1;
  bool is_correct = 2;
}